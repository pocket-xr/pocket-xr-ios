name: Screenshots

# App Store screenshots from the Simulator: iPhone 6.9" and iPad 13", each with the Space (two sites and the launcher
# in the preview), the tour and Settings. Run by hand; the pictures are the run's artifact.
on:
  workflow_dispatch:

jobs:
  shots:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Use Xcode 26
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$XC/Contents/Developer"

      - name: Moonlight's copies and ALVR's core
        run: bash scripts/gen-moonlight.sh

      - uses: actions/cache/restore@v4
        with:
          path: Native/alvr/AlvrClientCore.xcframework
          key: alvr-ios-e8ca92b-${{ hashFiles('scripts/build-alvr.sh', 'Native/alvr/alvr-pocketxr.patch', 'Native/alvr/alvr_client_core.h') }}

      - name: Build for the Simulator
        run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild -project PocketXR.xcodeproj -scheme PocketXR -configuration Release -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- \
            DEVELOPMENT_TEAM= build > build.log 2>&1 || { grep -E "error:" build.log | sort -u | head -40; exit 1; }

      - name: Take the pictures
        timeout-minutes: 15
        run: |
          set -euo pipefail
          APP=build/Build/Products/Release-iphonesimulator/PocketXR.app
          ID=com.hayeco.pocketxr.ios
          mkdir -p shots
          pick() { xcrun simctl list devices available -j | jq -r --arg re "$1" '[.devices | to_entries[] | select(.key | test("iOS-26")) | .value[] | select(.name | test($re))][0].udid'; }
          for dev in "iPhone 17 Pro Max|iPhone 16 Pro Max" "iPad Pro 13"; do
            UDID=$(pick "$dev")
            NAME=$(xcrun simctl list devices -j | jq -r --arg u "$UDID" '.devices[][] | select(.udid == $u) | .name')
            echo "$NAME ($UDID)"
            xcrun simctl boot "$UDID" || true
            xcrun simctl bootstatus "$UDID" -b
            xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 --wifiBars 3 --cellularBars 4 || true
            TAG=$(echo "$NAME" | tr ' ' '-' | tr -cd 'A-Za-z0-9-')
            # 1. The tour, as on a first start.
            xcrun simctl install "$UDID" "$APP"
            xcrun simctl launch "$UDID" "$ID"
            sleep 8
            xcrun simctl io "$UDID" screenshot "shots/$TAG-1-tour.png"
            xcrun simctl terminate "$UDID" "$ID" || true
            # 2. The Space: two sites and the launcher in the preview.
            xcrun simctl launch "$UDID" "$ID" -PXRShowcase YES -PXRFreshSpace YES -tour.seen YES
            DATA=$(xcrun simctl get_app_container "$UDID" "$ID" data)
            for i in $(seq 1 40); do [ -f "$DATA/Documents/showcase.txt" ] && break; sleep 1; done
            sleep 2
            xcrun simctl io "$UDID" screenshot "shots/$TAG-2-space.png"
            xcrun simctl terminate "$UDID" "$ID" || true
            # 3. Settings.
            xcrun simctl launch "$UDID" "$ID" -PXRShowSettings YES -tour.seen YES
            sleep 6
            xcrun simctl io "$UDID" screenshot "shots/$TAG-3-settings.png"
            xcrun simctl terminate "$UDID" "$ID" || true
            xcrun simctl shutdown "$UDID" || true
          done
          ls -la shots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-store-screenshots
          path: shots/
          retention-days: 30
