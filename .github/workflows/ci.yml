name: CI

# The repo is private while it is being built, so macOS minutes count against the organisation's free 2,000 Actions
# minutes a month at 10x (about 200 macOS minutes). Keep runs few: one job, older runs on the same branch cancelled.
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**.md']
  pull_request:
    paths-ignore: ['docs/**', '**.md']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Use Xcode 26
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          echo "Using $XC"
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version
          sw_vers

      - name: Make Moonlight's three copies (PC screens)
        run: bash scripts/gen-moonlight.sh

      - name: Core unit tests
        run: swift test 2>&1 | tail -20

      - name: Core checks
        run: |
          mkdir -p .build/checks
          swiftc -swift-version 5 -module-name CoreChecks -Onone Sources/PocketXRCore/*.swift Checks/*.swift -o .build/checks/core-checks
          .build/checks/core-checks

      - name: Make the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build for iPhone and iPad (device, unsigned)
        run: |
          set -o pipefail
          xcodebuild -project PocketXR.xcodeproj -scheme PocketXR -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build > build-device.log 2>&1             || { grep -E "error:" build-device.log | sort -u | head -60; exit 1; }
          grep -E "warning:" build-device.log | sort -u | head -40 || true
          tail -3 build-device.log

      - name: Build for the Simulator
        run: |
          set -o pipefail
          xcodebuild -project PocketXR.xcodeproj -scheme PocketXR -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= build > build-sim.log 2>&1             || { grep -E "error:" build-sim.log | sort -u | head -60; exit 1; }
          tail -3 build-sim.log

      - name: Build the stand-in computer (Pocket XR for Mac's computer side)
        continue-on-error: true
        timeout-minutes: 8
        run: |
          # Pocket XR for Mac (public) streams its test picture and tone when PXR_HOST_TEST=1, so a PC screen can be
          # tried end to end in the Simulator: pairing, launch, video and sound.
          git clone --depth 1 https://github.com/pocket-xr/pocket-xr-mac.git mac-host
          cd mac-host
          swift build -c release --product PocketXR 2>&1 | grep -E "error|warning: unre|Compiling|Build complete" | tail -15
          test -x .build/release/PocketXR && echo "HOST=$PWD/.build/release/PocketXR" >> "$GITHUB_ENV"

      - name: Run in the Simulator against fake glasses
        timeout-minutes: 10
        run: |
          set -euo pipefail
          swift build -c release --product FakeGlasses
          .build/release/FakeGlasses 52998 600 > fake-glasses.log 2>&1 &
          PC_ARGS=()
          if [ -n "${HOST:-}" ]; then
            PXR_HOST_TEST=1 "$HOST" --host --seconds 500 > host.log 2>&1 &
            # The PIN the app shows (-PXRPcPin) given to the host, again and again while it may be pairing.
            (for i in $(seq 1 60); do "$HOST" --host-pin 4321 >/dev/null 2>&1 || true; sleep 2; done) &
            PC_ARGS=(-PXRPcAddress 127.0.0.1:50989 -PXRPcAddress2 127.0.0.1:51989 -PXRPcPin 4321)
          fi
          UDID=$(xcrun simctl list devices available -j | jq -r '[.devices | to_entries[] | select(.key | test("iOS-26")) | .value[] | select(.name | test("^iPhone"))][0].udid')
          xcrun simctl list runtimes
          echo "$(date +%T) Simulator $UDID"
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          open -a Simulator --args -CurrentDeviceUDID "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          echo "$(date +%T) booted"
          xcrun simctl install "$UDID" build/Build/Products/Debug-iphonesimulator/PocketXR.app
          xcrun simctl launch --stdout="$PWD/app.log" --stderr="$PWD/app.log" "$UDID" com.hayeco.pocketxr.ios \
            -PXRProbeHost 127.0.0.1 -PXRSelfTest 20 -PXRDemo YES -PXRFreshSpace YES ${PC_ARGS[@]+"${PC_ARGS[@]}"}
          DATA=$(xcrun simctl get_app_container "$UDID" com.hayeco.pocketxr.ios data)
          for i in $(seq 1 200); do
            [ -f "$DATA/Documents/selftest.json" ] && [ -f "$DATA/Documents/space.json" ] && break
            sleep 1
          done
          sleep 2
          mkdir -p out
          cp "$DATA"/Documents/* out/ || true
          xcrun simctl io "$UDID" screenshot out/phone.png
          grep -E "pc screen|demo:|pc screens" "$DATA/Documents/pocketxr-log.txt" | tail -60 || true
          cat fake-glasses.log
          [ -f host.log ] && grep -vE "^\s*$" host.log | tail -60 || true

      - name: Try the Simulator's external display
        # Off: in five runs the headless runner's Simulator never gave the app an external display (docs/STATUS.md).
        if: false
        continue-on-error: true
        timeout-minutes: 4
        run: |
          # Simulator's I/O > External Displays menu, by UI scripting. Proven only if the app logs that iOS gave it
          # the external display scene.
          M='menu 1 of menu item "External Displays" of menu 1 of menu bar item "I/O" of menu bar 1'
          osascript -e 'tell application "Simulator" to activate'             -e "tell application \"System Events\" to tell process \"Simulator\" to get name of every menu item of $M"
          osascript -e 'tell application "Simulator" to activate'             -e "tell application \"System Events\" to tell process \"Simulator\"
                  set names to name of every menu item of $M
                  repeat with i from 1 to count of names
                    if (item i of names as text) contains \"1920\" then
                      click menu item i of $M
                      return \"clicked \" & (item i of names as text)
                    end if
                  end repeat
                  click menu item 2 of $M
                  return \"clicked item 2\"
                end tell"
          DATA=$(xcrun simctl get_app_container "$UDID" com.hayeco.pocketxr.ios data)
          for i in $(seq 1 30); do
            grep -q "external display connected" "$DATA/Documents/pocketxr-log.txt" && break
            sleep 1
          done
          cp "$DATA/Documents/pocketxr-log.txt" out/ || true
          grep "glasses:" "$DATA/Documents/pocketxr-log.txt"
          sleep 3
          xcrun simctl io "$UDID" screenshot --display=external out/external.png || echo "no external screenshot"

      - name: Check the self-test
        run: |
          set -euo pipefail
          jq . out/selftest.json | head -60
          jq -e '.probe.link == "streaming"' out/selftest.json
          jq -e '.probe.imuRateHz > 800' out/selftest.json
          jq -e '(.probe.yawMaxDeg - .probe.yawMinDeg) > 10' out/selftest.json
          jq . out/space.json
          jq -e '.done and (.errors | length == 0)' out/space.json
          jq -e '.buttonText == "clicked 1"' out/space.json
          jq -e '.fieldValue == "hello"' out/space.json
          jq -e '.listScrollTop > 100' out/space.json
          jq -e '.lockedMoveBlocked and .arrangedWithoutOverlap' out/space.json
          jq -e '.keyboardStayedDown' out/space.json
          jq -e '.shapedToPhone and .controlCenterLocked and .closedByWindowKey and .sideBySideOn' out/space.json
          jq '{steadyOnePicture, steadyHeadLocked, settingsWindowsBefore, settingsWindowsAfter, layoutsImported, recordFrames, recordSeconds}' out/space.json
          jq -e '.steadyOnePicture and .steadyHeadLocked' out/space.json
          jq -e '.settingsWindowsBefore > 0 and .settingsWindowsAfter == .settingsWindowsBefore and .layoutsImported > 0' out/space.json
          test -s out/glasses-1920x1080.png
          test -s out/glasses-3840x1080.png

      - name: Check the PC screen
        if: env.HOST != ''
        run: |
          set -euo pipefail
          jq '.pc' out/space.json
          jq -e '.pc.paired and .pc.framesShown > 30 and (.pc.videoLayerFailed | not)' out/space.json
          jq '.pc2, .readabilityZoom, .readabilityPcWidth' out/space.json
          jq -e '.pc2.paired and .pc2.framesShown > 30' out/space.json
          jq -e '.readabilityZoom > 1.3 and .readabilityPcWidth == 1440' out/space.json
          jq -e '.recordFrames > 30 and .recordSeconds > 2' out/space.json

      - name: Check the PC screen's sound
        if: env.HOST != ''
        continue-on-error: true
        run: jq -e '.pc.audioDecoded > 100' out/space.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulator-results
          path: |
            out/
            app.log
            fake-glasses.log
            host.log
            build-*.log
          retention-days: 14
