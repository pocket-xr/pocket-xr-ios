# XcodeGen spec for the Pocket XR iOS app: `xcodegen generate` makes PocketXR.xcodeproj (not kept in git).
name: PocketXR
options:
  bundleIdPrefix: com.hayeco
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: N9A4U4NP67
    CODE_SIGN_STYLE: Automatic
packages:
  PocketXRCore:
    path: .
targets:
  PocketXR:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: PocketXRCore
        product: PocketXRCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hayeco.pocketxr.ios
        PRODUCT_NAME: PocketXR
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_FILE: Config/Info.plist
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: Pocket XR
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocalNetworkUsageDescription: Pocket XR talks to your glasses over their USB cable to read head tracking, and finds your computer on the local network for PC screens.
        ITSAppUsesNonExemptEncryption: false
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
